<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>F3F Gestão — Proposta Comercial</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#020817;--gold:#e6c84f;--orange:#f97316;--ink:#0f172a;--dim:#475569;--line:#e2e8f0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  @page{size:A4;margin:12mm;}
  body{font-family:'Space Grotesk',sans-serif;color:var(--ink);background:#e2e8f0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* Formulário */
  .form{max-width:820px;margin:0 auto;padding:16px;}
  .form h1{font-size:20px;margin:8px 0 4px;}.form .hint{font-size:13px;color:var(--dim);margin-bottom:14px;}
  fieldset{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;}
  legend{font-weight:700;padding:0 6px;font-size:14px;}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px;}
  input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:16px 'Space Grotesk';background:#fff;color:var(--ink);}
  textarea{min-height:70px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:600px){.row{grid-template-columns:1fr;}}
  .item{display:grid;grid-template-columns:1fr 70px 110px 36px;gap:6px;margin-bottom:6px;}
  .item input{padding:8px;font-size:15px;}
  .item button,.add{border:1px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer;font-size:15px;}
  .add{padding:8px 12px;margin-top:4px;}
  .actions{position:sticky;bottom:0;background:var(--navy);padding:10px;border-radius:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .actions button{background:var(--gold);border:0;border-radius:8px;padding:12px 16px;font:700 15px 'Space Grotesk';cursor:pointer;}
  .actions button.sec{background:#1e293b;color:#e2e8f0;}
  /* Proposta */
  .doc{max-width:820px;margin:16px auto;background:#fff;padding:14mm;box-shadow:0 4px 24px rgba(0,0,0,.12);}
  @media print{body{background:#fff;}.form{display:none;}.doc{margin:0;padding:0;box-shadow:none;max-width:none;}}
  .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--gold);padding-bottom:10px;margin-bottom:14px;}
  .logo{font-size:22px;font-weight:800;}.logo span{color:#b8961c;}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-right:8px;}
  .meta{text-align:right;font-size:12px;color:var(--dim);line-height:1.6;}.meta b{color:var(--ink);font-size:15px;}
  .doc h2{font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin:16px 0 6px;}
  .doc p,.doc li{font-size:13px;line-height:1.6;}
  .box{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .box span{color:var(--dim);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-weight:600;}
  td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  td.n,th.n{text-align:right;white-space:nowrap;}
  tr.total td{font-weight:700;font-size:14px;border-top:2px solid var(--ink);border-bottom:none;}
  .pre{white-space:pre-wrap;}
  .sign{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:30px;font-size:12px;text-align:center;}
  .sign div{border-top:1px solid var(--ink);padding-top:6px;}
  .foot{margin-top:18px;font-size:11px;color:var(--dim);text-align:center;border-top:1px solid var(--line);padding-top:8px;}
</style>
</head>
<body>

<div class="form">
  <h1>Gerador de Proposta — F3F</h1>
  <p class="hint">Preencha, confira a prévia abaixo e toque em <b>Gerar PDF</b> (no iPhone: Compartilhar → Imprimir → afaste os dedos na prévia → Compartilhar o PDF). Os dados ficam salvos só neste aparelho.</p>

  <fieldset><legend>Cliente</legend>
    <div class="row">
      <div><label>Empresa</label><input id="cliente" placeholder="Ex.: Sul Vale"></div>
      <div><label>A/C (contato)</label><input id="contato" placeholder="Ex.: Gabriel Garcia — Financeiro"></div>
    </div>
    <div class="row">
      <div><label>Local da obra</label><input id="local" placeholder="Cidade/UF ou coordenadas"></div>
      <div><label>Concessionária</label><input id="concessionaria" placeholder="Ex.: Equatorial Goiás"></div>
    </div>
  </fieldset>

  <fieldset><legend>Projeto</legend>
    <div class="row">
      <div><label>Tipo de serviço</label>
        <select id="tipo">
          <option>Subestação aérea em poste</option>
          <option>Subestação abrigada (cabine primária)</option>
          <option>Rede de média tensão (MT)</option>
          <option>Rede de média e baixa tensão (MT/BT)</option>
          <option>Aumento de carga / troca de transformador</option>
          <option>Nova ligação</option>
        </select></div>
      <div><label>Potência / carga</label><input id="potencia" placeholder="Ex.: 225 kVA"></div>
    </div>
    <label>Escopo (um item por linha)</label>
    <textarea id="escopo">Levantamento técnico em campo
Projeto elétrico executivo e memorial descritivo
Aprovação do projeto junto à concessionária
Emissão de ART
Fornecimento de materiais conforme lista do projeto
Execução da obra com equipe especializada
Comissionamento, energização e entrega do as-built</textarea>
  </fieldset>

  <fieldset><legend>Itens e valores</legend>
    <div id="itens"></div>
    <button class="add" onclick="addItem()">+ Adicionar item</button>
  </fieldset>

  <fieldset><legend>Condições</legend>
    <div class="row">
      <div><label>Prazo de execução</label><input id="prazo" placeholder="Ex.: 45 dias após aprovação"></div>
      <div><label>Validade da proposta</label><input id="validade" value="15 dias"></div>
    </div>
    <label>Forma de pagamento</label><input id="pagamento" placeholder="Ex.: 40% na assinatura, 40% na entrega dos materiais, 20% na energização">
    <label>Não incluso / observações</label>
    <textarea id="obs">Taxas e custos cobrados pela concessionária.
Obras civis não descritas no escopo.
Valores sujeitos a revisão caso a concessionária exija alterações no projeto.</textarea>
  </fieldset>

  <fieldset><legend>Emitente</legend>
    <div class="row">
      <div><label>Responsável</label><input id="resp" value="Fernando Cássio"></div>
      <div><label>CNPJ / CREA (opcional)</label><input id="registro" placeholder="Preencha se quiser exibir"></div>
    </div>
  </fieldset>

  <div class="actions">
    <button onclick="window.print()">⬇ Gerar PDF</button>
    <button class="sec" onclick="novo()">Nova proposta</button>
  </div>
</div>

<div class="doc" id="doc"></div>

<script>
const campos=['cliente','contato','local','concessionaria','tipo','potencia','escopo','prazo','validade','pagamento','obs','resp','registro'];
const $=id=>document.getElementById(id);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;

function addItem(d='',q='1',v=''){
  const el=document.createElement('div');el.className='item';
  el.innerHTML='<input placeholder="Descrição" class="d"><input placeholder="Qtd" class="q" inputmode="decimal"><input placeholder="Valor unit. R$" class="v" inputmode="decimal"><button title="Remover">✕</button>';
  el.querySelector('.d').value=d;el.querySelector('.q').value=q;el.querySelector('.v').value=v;
  el.querySelector('button').onclick=()=>{el.remove();render();};
  el.querySelectorAll('input').forEach(i=>i.oninput=render);
  $('itens').appendChild(el);render();
}
function itens(){return [...document.querySelectorAll('.item')].map(e=>({d:e.querySelector('.d').value,q:num(e.querySelector('.q').value),v:num(e.querySelector('.v').value)})).filter(i=>i.d);}
function numero(){
  let n;try{n=localStorage.getItem('f3f_prop_num');}catch(e){}
  if(!n){const d=new Date();n=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');try{localStorage.setItem('f3f_prop_num',n);}catch(e){}}
  return n;
}
function render(){
  const f={};campos.forEach(c=>f[c]=$(c).value);
  const its=itens();const total=its.reduce((s,i)=>s+i.q*i.v,0);
  const hoje=new Date().toLocaleDateString('pt-BR');
  $('doc').innerHTML=`
  <div class="head">
    <div><div class="logo"><span class="dot"></span>F3F <span>Gestão</span></div>
      <div style="font-size:12px;color:#475569;margin-top:4px;">Redes MT/BT · Subestações · Energia</div></div>
    <div class="meta"><b>PROPOSTA COMERCIAL</b><br>Nº ${esc(numero())}<br>${hoje}</div>
  </div>
  <div class="box">
    <div><span>Cliente:</span> ${esc(f.cliente)||'—'}</div><div><span>A/C:</span> ${esc(f.contato)||'—'}</div>
    <div><span>Local:</span> ${esc(f.local)||'—'}</div><div><span>Concessionária:</span> ${esc(f.concessionaria)||'—'}</div>
    <div><span>Serviço:</span> ${esc(f.tipo)}</div><div><span>Potência/carga:</span> ${esc(f.potencia)||'—'}</div>
  </div>
  <h2>Escopo do fornecimento</h2>
  <ul style="padding-left:18px;">${f.escopo.split('\n').filter(l=>l.trim()).map(l=>'<li>'+esc(l)+'</li>').join('')}</ul>
  <h2>Investimento</h2>
  <table><thead><tr><th>Descrição</th><th class="n">Qtd</th><th class="n">Unitário</th><th class="n">Total</th></tr></thead><tbody>
  ${its.map(i=>`<tr><td>${esc(i.d)}</td><td class="n">${i.q.toLocaleString('pt-BR')}</td><td class="n">${brl(i.v)}</td><td class="n">${brl(i.q*i.v)}</td></tr>`).join('')||'<tr><td colspan="4" style="color:#94a3b8">Adicione itens no formulário</td></tr>'}
  <tr class="total"><td colspan="3">Total</td><td class="n">${brl(total)}</td></tr></tbody></table>
  <h2>Condições comerciais</h2>
  <div class="box">
    <div><span>Prazo:</span> ${esc(f.prazo)||'A combinar'}</div><div><span>Validade:</span> ${esc(f.validade)}</div>
    <div style="grid-column:1/-1"><span>Pagamento:</span> ${esc(f.pagamento)||'A combinar'}</div>
  </div>
  ${f.obs.trim()?`<h2>Não incluso / observações</h2><p class="pre">${esc(f.obs)}</p>`:''}
  <div class="sign"><div>${esc(f.resp)}<br>F3F Gestão${f.registro?'<br>'+esc(f.registro):''}</div><div>De acordo — ${esc(f.cliente)||'Cliente'}</div></div>
  <div class="foot">F3F Gestão · (62) 99289-2170 · f3f.gestao@gmail.com · f3f.vercel.app</div>`;
  try{const s={};campos.forEach(c=>s[c]=$(c).value);s.itens=itens();localStorage.setItem('f3f_prop',JSON.stringify(s));}catch(e){}
}
function novo(){
  if(!confirm('Começar nova proposta? Os dados atuais serão limpos.'))return;
  try{localStorage.removeItem('f3f_prop');localStorage.removeItem('f3f_prop_num');}catch(e){}
  location.reload();
}
let salvo=null;try{salvo=JSON.parse(localStorage.getItem('f3f_prop'));}catch(e){}
if(salvo){campos.forEach(c=>{if(salvo[c]!=null)$(c).value=salvo[c];});(salvo.itens||[]).forEach(i=>addItem(i.d,String(i.q),String(i.v).replace('.',',')));}
else{addItem('Projeto elétrico, aprovação na concessionária e ART','1','');addItem('Materiais (conforme lista do projeto)','1','');addItem('Mão de obra de execução e comissionamento','1','');}
campos.forEach(c=>$(c).addEventListener('input',render));$('tipo').addEventListener('change',render);
render();
</script>
</body>
</html>
